{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <title>Регистрация</title>
</head>
<body>
  <div class="main-login">
    <div class="left-login">
      <h1>Создайте аккаунт<br>и станьте частью нашей команды</h1>
      <img src="{% static 'images/person-working.svg' %}" class="left-login-image" alt="Человек работает">
    </div>
    <div class="right-login">
      <div class="card-login">
        <h1>РЕГИСТРАЦИЯ</h1>
        {% if messages %}
          <div style="width: 100%; margin-top: 10px;">
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }}" style="color: white; background: #ff4d4d; border-radius: 8px; padding: 10px 15px; margin-bottom: 10px;">
                <i class="bi bi-exclamation-circle-fill"></i> {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
        <form action="{% url 'register' %}" class="form" method="post">
          {% csrf_token %}
          <div class="textfield">
            <label for="username">Имя пользователя</label>
            <input type="text" name="username" placeholder="Придумайте имя пользователя" required>
          </div>
          <div class="textfield">
            <label for="email">Электронная почта</label>
            <input type="email" name="email" placeholder="Введите ваш email" required>
          </div>
          <div class="textfield">
            <label for="password">Пароль</label>
            <input type="password" name="password" placeholder="Придумайте пароль" required>
          </div>
          <button class="btn-login">Зарегистрироваться</button>
        </form>
        
        <p style="color: #f0ffffde; margin-top: 10px;">
          Уже есть аккаунт?
          <a href="{% url 'login' %}" style="color: #00ff88; text-decoration: underline;">Войти здесь</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
