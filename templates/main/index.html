{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Распознавание жестов</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: white;
    }
    #video {
      width: 224px;
      height: 224px;
      border-radius: 12px;
      border: 3px solid #555;
      box-shadow: 0 0 10px #0f0;
    }
    #result {
      font-size: 1.5rem;
      margin-top: 15px;
      color: #00e676;
      background-color: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
    }
    #output {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #ccc;
    }
    .history-item {
      background-color: #1d1d1d;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 5px;
      border-left: 4px solid #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container py-5 text-center">
    <h1 class="mb-4">🎥 Жестовое Распознавание</h1>

    <div class="mb-3">
      <video id="video" autoplay muted></video>
    </div>

    <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">
      <button class="btn btn-success" onclick="startCamera()">▶️ Старт</button>
      <button class="btn btn-danger" onclick="stopCamera()">⏹️ Стоп</button>
      <button class="btn btn-warning" onclick="saveFullText()">💾 Сохранить</button>
      <button class="btn btn-secondary" onclick="clearFullText()">🗑️ Очистить</button>
    </div>

    <div id="loader" class="text-warning mb-3" style="display:none;">🔄 Загружается модель...</div>
    <div id="result">Жест: ...</div>
    <div id="output">Текст: ...</div>

    <div id="history" class="mt-5 text-start mx-auto" style="max-width: 400px;">
      <h4 class="text-muted">История</h4>
      <div id="history-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="{% static 'js/new.js' %}"></script>
</body>
</html>
