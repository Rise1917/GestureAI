{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>SignEcho - Приложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #2a2a3e;
            color: white;
        }

        /* Header */
        .header {
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a3a5e;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden; /* Ensure image fits within the circle */
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover the area, cropping if necessary */
            border-radius: 50%; /* Make the image circular */
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #00ff88;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #00ff88;
            padding: 8px 16px;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
        }

        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Ensure image fits within the circle */
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover the area, cropping if necessary */
            border-radius: 50%; /* Make the image circular */
        }

        /* Main Content */
        .main-content {
            display: flex;
            height: calc(100vh - 80px);
            gap: 20px;
            padding: 20px;
        }

        /* Left Panel - Camera and Controls */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

.camera-container {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  background-color: #1a1a2e;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  max-width: 100%;
  overflow: hidden;
}

#video {
  border-radius: 12px;
  width: 100%;
  max-width: 350px;
  aspect-ratio: 1 / 1; /* квадрат 224x224 */
  object-fit: cover;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
  border: 2px solid #444;
}


        .controls-panel {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .controls-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-label {
            color: #ccc;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .text-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .text-section {
            text-align: center;
        }

        .text-section h3 {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .dropdown {
            background: #4a4a6e;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            width: 100%;
            -webkit-appearance: none; /* Remove default dropdown arrow for custom styling */
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%20viewBox%3D%220%200%20292.4%20292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%20197.6c-4.2%204.2-9.6%206.3-15.8%206.3s-11.6-2.1-15.8-6.3L146.2%2099.7%2037%20197.6c-4.2%204.2-9.6%206.3-15.8%206.3s-11.6-2.1-15.8-6.3c-8.4-8.4-8.4-22.1%200-30.5L130.4%2063.8c8.4-8.4%2022.1-8.4%2030.5%200l113.8%20113.8c8.4%208.4%208.4%2022.1%200%2030.5z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }


        .dropdown:focus {
            outline: none;
            box-shadow: 0 0 0 2px #00ff88;
        }

        .history-btn {
            background: #4a4a6e;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        .history-btn:hover {
            background: #5a5a7e;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .text-input {
            flex: 1;
            background: #d0d0d0;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            color: #333;
            min-height: 50px;
            resize: none;
        }

        .text-input::placeholder {
            color: #666;
        }

        .text-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #00ff88;
        }

        .voice-btn {
            background: #00ff88;
            border: none;
            border-radius: 10px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden; /* Ensure image fits within the button */
        }

        .voice-btn:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        .voice-btn img {
            width: 70%; /* Adjust size as needed */
            height: 70%; /* Adjust size as needed */
            object-fit: contain;
        }


        /* Right Panel - Chat */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .chat-header {
            background: #4a4a6e;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #2a2a3e;
        }

        .chat-input-container {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: #1a1a2e;
        }

        .chat-input {
            flex: 1;
            background: #4a4a6e;
            border: none;
            border-radius: 25px;
            padding: 15px 20px;
            color: white;
            font-size: 14px;
        }

        .chat-input::placeholder {
            color: #ccc;
        }

        .chat-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #00ff88;
        }

        .send-btn {
            background: #00ff88;
            border: none;
            border-radius: 25px;
            padding: 15px 25px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }

            .left-panel, .right-panel {
                flex: none;
            }

            .camera-container {
                height: 300px;
            }

            .right-panel {
                height: 400px;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .main-content {
                padding: 10px;
                gap: 10px;
            }

            .text-sections {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .controls-row {
                flex-direction: column;
                gap: 10px;
            }

            .input-row {
                flex-direction: column;
                gap: 10px;
            }

            .voice-btn {
                width: 100%;
                height: 40px;
            }
        }
 .profile-button {
	background-color: #00ff94;
	color: #000;
	font-weight: bold;
	font-size: 16px;
	padding: 10px 50px 10px 20px;
	border-radius: 20px;
	display: inline-flex;
	align-items: center;
	position: relative;
 }
 
 .profile-button img {
	width: 48px;
	height: 48px;
	border-radius: 50%;
	object-fit: cover;
	position: absolute;
	right: -12px;
	top: 50%;
	transform: translateY(-50%);
	border: 3px solid #1c1a25; /* Чтобы обводка не сливалась с фоном */
 }



 .modal {
  display: none;
  position: fixed;
  z-index: 999;
  padding-top: 80px;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.6);
}

.modal-content {
  background-color: #2c2c2c;
  margin: auto;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
  color: white;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.close {
  color: #ccc;
  float: right;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}

.close:hover {
  color: white;
}

#historyList {
  list-style: none;
  padding-left: 0;
  margin-top: 20px;
}

#historyList li {
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  background-color: #3a3a3a;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  background-color: #3a3a3a;
  margin-bottom: 8px;
  border-radius: 8px;
}

.gesture-text {
  flex-grow: 1;
  margin-right: 10px;
}

.history-item button {
  margin-left: 5px;
  background: transparent;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 18px;
}

.history-item button:hover {
  color: #ff4d4d;
}



    </style>
</head>
<body>
    <header class="header">
        <a style="text-decoration: none; color:#fff ;" href="{% url 'home' %}" class="logo">
            <div class="logo-icon">
                <img src="{% static 'images/Logopng.png' %}" alt="SignEcho Logo">
            </div>
            <div class="logo-text">SignEcho</div>
        </a>
        <nav class="nav-links">
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
            <a href="#help">Помощь</a>
        </nav>
        <div class="profile">
        {% if user.is_authenticated %}
            		<a href="{% url 'profile' %}" class="profile-button">
                  <span>{{ user.username }}</span>
                  {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" alt="Аватар" />
                  {% else %}
                    <img src="{% static 'images/default_avatar.jpg' %}" alt="Аватар" />
                  {% endif %}
                </a>
        {% else %}
          <a href="{% url 'login' %}" class="login-btn">Войти</a>
        {% endif %}
        </div>
    </header>

    <div class="main-content">
        <div class="left-panel">
            <div class="camera-container">
            <video id="video" autoplay muted></video>
            </div>

            <div class="controls-panel">
                <div class="text-sections">
                    <div class="text-section">
                        <h3 id="result">Жест:</h3>
                        <span>Текст:</span><h3 style="display: inline-block; margin-left: 5px;" id="output"></h3>
                    </div>
                </div>
                    <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">
                        <button class="btn btn-success" onclick="startCamera()">▶️ Старт</button>
                        <button class="btn btn-danger" onclick="stopCamera()">⏹️ Стоп</button>
                        <button class="btn btn-warning" onclick="saveFullText()">💾 Сохранить</button>
                        <button class="btn btn-secondary" onclick="clearFullText()">🗑️ Очистить</button>
                        <button class="voice-btn" onclick="speakFullGesture()">
                            <img src="{% static 'images/Group 38076.png' %}" alt="Voice Icon">
                        </button>
                    </div>

                <div class="controls-row">
                    <select id="language-select" class="dropdown">
                    <option value="ru-RU">Русский</option>
                    </select>

                    <button class="history-btn" onclick="openHistoryModal()">История</button>
                </div>
            </div>
        </div>

                    <!-- Модальное окно -->
            <div id="historyModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeHistoryModal()">&times;</span>
                <h2>История жестов</h2>
                <ul id="historyList" class="history-list"></ul>
            </div>
            </div>

        <div class="right-panel">
            <div class="chat-header">Чат</div>
            <div class="chat-messages">
                </div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" placeholder="Текст">
                <button class="send-btn">Отправить</button>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="{% static 'js/new.js' %}"></script>

    <script>
        // Simple interactivity
        document.addEventListener('DOMContentLoaded', function() {
            const voiceBtn = document.querySelector('.voice-btn');
            const sendBtn = document.querySelector('.send-btn');
            const chatInput = document.querySelector('.chat-input');
            const chatMessages = document.querySelector('.chat-messages');
            const textInput = document.querySelector('.text-input');

            // Voice button animation
            voiceBtn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
            });

            // Send message functionality
            sendBtn.addEventListener('click', function() {
                const message = chatInput.value.trim();
                if (message) {
                    const messageElement = document.createElement('div');
                    messageElement.style.cssText = `
                        background: #00ff88;
                        color: #000;
                        padding: 10px 15px;
                        border-radius: 15px;
                        margin-bottom: 10px;
                        margin-left: auto;
                        max-width: 80%;
                        width: fit-content;
                    `;
                    messageElement.textContent = message;
                    chatMessages.appendChild(messageElement);
                    chatInput.value = '';
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            });

            // Enter key to send
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });

            // Dropdown styling
            const dropdown = document.querySelector('.dropdown');
            dropdown.addEventListener('change', function() {
                this.style.color = '#00ff88';
            });
        });
    </script>
</body>
</html>
